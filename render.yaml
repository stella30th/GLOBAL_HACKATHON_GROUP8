services:
  # Spring Boot Backend Service
  - type: web
    name: aicareer-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Lets Render mark the instance healthy as soon as the web layer answers, without waiting on
    # the database or the background job import.
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Exactly two models are ever contacted. The requirement names Gemini 3.5 Flash as primary
      # and 3.1 Flash-Lite as fallback; the order is reversed here because 3.5 Flash allows only
      # about 20 requests/day per project on the free tier and one plan costs four calls, so a demo
      # would exhaust it in a handful of runs. Swap the two values to follow the stated order.
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      # SFIA is licensed content, so it is neither committed nor baked into the image, and the
      # container filesystem is ephemeral so a file copied in by hand does not survive a cold
      # start. The workbook is therefore fetched at start-up from private storage you control
      # (Cloudflare R2, S3, or any URL that serves the .xlsx). Both values are secrets - set them
      # in the Render dashboard, not here. Leave them unset and the app runs on the bundled
      # technology vocabulary and says so in the Sources & data panel.
      - key: SFIA_DATA_DIR
        value: /tmp/sfia
      - key: SFIA_SOURCE_URL
        sync: false
      - key: SFIA_SOURCE_TOKEN
        sync: false
      # Guards /api/admin/**, which replaces the reference framework every analysis is built on.
      # Unset means those endpoints refuse everything.
      - key: ADMIN_TOKEN
        sync: false
      # The session cookie is the only thing separating one person's CV from another's, so the
      # API accepts credentialed calls from this origin and no other. Must match the frontend URL
      # exactly, scheme included.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aicareer-db
          property: connectionString
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect

  # React Vite Frontend Static Site
  - type: web
    name: aicareer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: main
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite emits content-hashed filenames, so the built assets are safe to cache indefinitely.
      # This is what makes repeat visits fast even while the backend is waking up.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE
        value: https://aicareer-backend-c0e3.onrender.com/api

databases:
  - name: aicareer-db
    databaseName: aicareer_db
    user: aicareer_user
    plan: free
    region: singapore
