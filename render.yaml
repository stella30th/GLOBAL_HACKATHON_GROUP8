services:
  # Spring Boot Backend Service
  - type: web
    name: aicareer-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Lets Render mark the instance healthy as soon as the web layer answers, without waiting on
    # the database or the background job import.
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # gemini-3.5-flash allows only 20 requests/day on the free tier, which this app exhausts in
      # minutes; after that every AI feature silently returns offline text. The lite models carry a
      # much larger free allowance, and the backend falls through the list below on 429/404.
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-flash-latest,gemini-3.5-flash,gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: aicareer-db
          property: connectionString
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect

  # React Vite Frontend Static Site
  - type: web
    name: aicareer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: main
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite emits content-hashed filenames, so the built assets are safe to cache indefinitely.
      # This is what makes repeat visits fast even while the backend is waking up.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE
        value: https://aicareer-backend-c0e3.onrender.com/api

databases:
  - name: aicareer-db
    databaseName: aicareer_db
    user: aicareer_user
    plan: free
    region: singapore
