services:
  # Spring Boot Backend Service
  - type: web
    name: aicareer-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Lets Render mark the instance healthy as soon as the web layer answers, without waiting on
    # the database or the background job import.
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Exactly two models are ever contacted. The requirement names Gemini 3.5 Flash as primary
      # and 3.1 Flash-Lite as fallback; the order is reversed here because 3.5 Flash allows only
      # about 20 requests/day per project on the free tier and one plan costs four calls, so a demo
      # would exhaust it in a handful of runs. Swap the two values to follow the stated order.
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      # Where the SFIA 9 workbook is read from. Render's filesystem is ephemeral, so loading SFIA
      # in a deployment needs a persistent disk mounted here (or a build step that fetches it from
      # storage you control). Without it the app runs on the bundled technology vocabulary and says
      # so in the Sources & data panel.
      - key: SFIA_DATA_DIR
        value: /var/data/sfia
      - key: DATABASE_URL
        fromDatabase:
          name: aicareer-db
          property: connectionString
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect

  # React Vite Frontend Static Site
  - type: web
    name: aicareer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    branch: main
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite emits content-hashed filenames, so the built assets are safe to cache indefinitely.
      # This is what makes repeat visits fast even while the backend is waking up.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE
        value: https://aicareer-backend-c0e3.onrender.com/api

databases:
  - name: aicareer-db
    databaseName: aicareer_db
    user: aicareer_user
    plan: free
    region: singapore
