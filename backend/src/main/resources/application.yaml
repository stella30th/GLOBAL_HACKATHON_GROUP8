server:
  port: ${PORT:8080}
  compression:
    # Job listings and AI analyses are sizeable JSON payloads; compressing them is the cheapest
    # win available on Render's free tier, where bandwidth and latency dominate response time.
    enabled: true
    mime-types: application/json,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024
  shutdown: graceful

spring:
  application:
    name: AICareerCode
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/aicareer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:rootpassword}}
    driver-class-name: ${DATABASE_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:}
    hibernate:
      ddl-auto: update
    show-sql: false
    # Closing the session at the end of the service call rather than at the end of the request
    # keeps a connection from being held for the whole render of a response.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # Primary model. gemini-3.5-flash is capable but its free tier allows only 20 requests per day
    # per project, which this app exhausts quickly; the lite models have a far larger allowance.
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    # Tried in order when the primary is rate limited (429) or unavailable to the key (404).
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-flash-latest,gemini-3.5-flash,gemini-2.5-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:45}

jobs:
  themuse:
    # Optional. The Muse answers unauthenticated requests from a developer machine but returns 403
    # to datacenter IPs; a free key from https://www.themuse.com/developers/api/v2 restores the
    # source. Without it the other five boards are used and The Muse is skipped.
    api-key: ${THE_MUSE_API_KEY:}

logging:
  level:
    com.gbhackathon.AICareerCode: INFO
