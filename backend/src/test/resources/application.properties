# Slice tests run against an in-memory H2 database, never a deployment database.
spring.datasource.url=jdbc:h2:mem:aicareer-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# No API key: every AI call in a test fails fast with AiUnavailableException rather than reaching
# the network. Tests that need model behaviour use an in-test stub, never a live call.
ai.gemini.api-key=
